name: Temporary typography validation

on:
  push:
    branches:
      - agent/increase-id-typography

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run unit and contract tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q profile_generator tests
